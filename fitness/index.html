<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fitness"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Fitness · Dein Training</title>
<style>
:root{--ink:#212b26;--muted:#727c75;--green:#245b46;--lime:#d9f27a;--paper:#f6f5f0;--line:#e6e7df;--card:#fff;--soft:#eef2e6;--orange:#f0a466}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8da653;outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:26px 24px 76px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-size:21px;font-weight:850;letter-spacing:-.8px}.brand i{font-style:normal;color:var(--green)}.tiny{font-size:13px;color:var(--muted)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(34px,6vw,53px);line-height:1.04;letter-spacing:-2.6px;margin:8px 0 14px}.intro{color:var(--muted);margin:0 0 24px}.top-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:24px}.hero{background:var(--green);color:#fff;border:0;padding:30px;min-height:260px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.hero .eyebrow{color:#c8e39c}.hero h2{font-size:30px;line-height:1.1;letter-spacing:-1.2px;margin:9px 0}.hero p{color:#d8e5db;margin:0 0 23px;max-width:360px}.start{border:0;border-radius:15px;background:var(--lime);color:#17251c;font-weight:850;font-size:17px;padding:16px 22px;display:inline-flex;align-items:center;gap:12px;box-shadow:0 5px 0 #93aa4e}.start span{font-size:21px}.week-card h2,.history h2,.summary h2{font-size:18px;margin:3px 0 15px;letter-spacing:-.4px}.week-count{font-size:30px;font-weight:850;letter-spacing:-1.1px}.week-count small{font-size:14px;font-weight:550;color:var(--muted);letter-spacing:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:17px 0 9px}.day{text-align:center;color:var(--muted);font-size:11px}.day b{margin:0 auto 6px;display:grid;place-items:center;width:33px;height:33px;border-radius:50%;background:#f0f1ec;font-size:12px;color:#7c857e}.day.done b{background:var(--lime);color:#344320}.day.today{color:var(--green);font-weight:800}.week-note{font-size:12px;color:var(--muted)}.summary{margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px 17px;background:#f8f8f4;border-radius:15px}.stat strong{font-size:24px;display:block;letter-spacing:-.7px}.stat span{font-size:12px;color:var(--muted)}.history{margin-top:18px}.history-top{display:flex;justify-content:space-between;align-items:center}.history-list{display:grid;gap:9px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fafaf7;border-radius:14px;padding:13px 15px}.history-row strong{font-size:14px}.history-row small{display:block;color:var(--muted);font-size:12px}.history-row .reps{font-weight:800;color:var(--green);white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--muted);background:#fafaf7;border-radius:14px}.hidden{display:none!important}
/* workout */
.workout-view{max-width:820px;margin:auto}.workout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{border:0;background:none;color:var(--green);font-weight:750;padding:8px 0}.progressline{height:6px;background:#e2e6dc;border-radius:9px;margin:10px 0 22px;overflow:hidden}.progressline i{height:100%;background:var(--lime);display:block;transition:width .25s}.workout-view h1{font-size:38px}.workout-desc{color:var(--muted);margin-top:-4px}.exercise-list{display:grid;gap:14px;margin-top:22px}.exercise{padding:14px;display:grid;grid-template-columns:148px 1fr;gap:18px;align-items:center}.art{height:126px;border-radius:15px;background:#f0f2e9;display:grid;place-items:center;overflow:hidden}.art svg{width:100%;height:100%}.ex-title{display:flex;justify-content:space-between;align-items:start;gap:10px}.ex-title h2{font-size:17px;margin:0 0 3px}.ex-title small{font-size:12px;color:var(--muted)}.muscle{background:#eef2e6;color:var(--green);border-radius:20px;font-size:11px;font-weight:750;padding:5px 8px;white-space:nowrap}.sets{display:grid;grid-template-columns:repeat(2,minmax(75px,100px)) auto;align-items:end;gap:9px;margin-top:12px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input{width:100%;border:1px solid #d9ded4;border-radius:10px;background:#fff;padding:9px 10px;font-weight:750;color:var(--ink)}.side-note{font-size:11px;color:var(--muted);padding-bottom:9px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.button{border:0;border-radius:12px;padding:13px 18px;font-weight:800}.button.primary{background:var(--green);color:white}.button.light{background:#e9ede4;color:var(--ink)}.button:disabled{opacity:.5;cursor:default}.finish{text-align:center;padding:32px}.finish .check{font-size:54px}.finish h1{font-size:40px}.finish p{color:var(--muted)}.finish .button{margin-top:15px}.finish .delete-training{background:#f6e9e6;color:#813b30;margin-left:8px}.delete-confirmation{max-width:440px;margin:22px auto 0;padding:18px;border:1px solid #e7c7c0;border-radius:16px;background:#fff8f6}.delete-confirmation p{margin:0 0 12px}.delete-confirmation .button{margin:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202a24;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 8px 30px #0002}.footer-note{font-size:11px;color:#89928a;margin-top:20px}
@media(max-width:700px){.shell{padding:20px 16px 55px}header{margin-bottom:29px}.top-grid{grid-template-columns:1fr}.hero{min-height:248px;padding:24px}.card{padding:20px}.stats{gap:7px}.stat{padding:13px}.stat strong{font-size:22px}.exercise{grid-template-columns:110px 1fr;gap:13px;padding:11px}.art{height:112px}.sets{grid-template-columns:repeat(2,minmax(65px,1fr));gap:7px}.side-note{grid-column:1/-1;padding:0}.ex-title{display:block}.muscle{display:inline-block;margin-top:4px}.workout-view h1{font-size:34px}}
@media(max-width:390px){.exercise{grid-template-columns:1fr}.art{height:155px}.sets{grid-template-columns:1fr 1fr auto}.side-note{grid-column:auto}}
/* Anpassungen: klare Schwierigkeitsskala und gut sichtbare Übungsillustrationen */
header{margin-bottom:24px}.top-grid{grid-template-columns:1.2fr .8fr;align-items:stretch}.hero{min-height:355px;gap:22px}.difficulty-box{width:100%;border-radius:16px;background:#ffffff12;padding:14px 15px 12px;margin:2px 0 18px}.difficulty-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:750}.difficulty-head strong{color:var(--lime);text-align:right}.difficulty-box input[type=range]{width:100%;accent-color:var(--lime);height:27px;margin:8px 0 0;cursor:pointer}.difficulty-ends{display:flex;justify-content:space-between;color:#d6e3da;font-size:11px}.hero p{margin-bottom:13px}.week-card{align-self:stretch;display:flex;flex-direction:column;justify-content:center}.workout-view{max-width:900px}.workout-view h1{margin-top:5px}.exercise-list{margin-top:18px}.exercise{padding:22px;grid-template-columns:minmax(240px,38%) 1fr;gap:24px;min-height:300px}.art{height:255px;border-radius:18px}.art svg{width:100%;height:100%}.ex-title h2{font-size:22px;line-height:1.2}.ex-title small{font-size:15px;display:block;margin-top:5px}.muscle{font-size:12px;padding:7px 10px}.sets{grid-template-columns:repeat(2,minmax(110px,160px)) auto;gap:12px;margin-top:24px}.field label{font-size:13px}.field input{font-size:20px;padding:13px}.side-note{font-size:12px}.actions{margin-top:22px}.button{font-size:17px;padding:16px 22px}.button.primary{min-width:210px}.button.light{min-width:130px}.workout-head .tiny{font-size:15px}.workout-desc{font-size:17px}.exercise-list+.actions{margin-top:24px}
@media(max-width:700px){header{margin-bottom:22px}.top-grid{grid-template-columns:1fr}.hero{min-height:unset;padding:24px;gap:18px}.week-card{min-height:220px}.exercise{grid-template-columns:1fr;gap:18px;padding:18px;min-height:unset}.art{height:250px}.art img{display:block;width:100%;height:100%;object-fit:contain;border-radius:14px}.ex-title{display:flex}.ex-title h2{font-size:21px}.ex-title small{font-size:14px}.sets{grid-template-columns:1fr 1fr auto;margin-top:20px;gap:10px}.field input{font-size:20px;padding:13px}.actions{gap:12px}.button.primary{min-width:0;flex:1}.button.light{min-width:100px}.workout-view h1{font-size:36px}}
@media(max-width:390px){.art{height:230px}.art img{display:block;width:100%;height:100%;object-fit:contain;border-radius:14px}.sets{grid-template-columns:1fr 1fr auto}.side-note{grid-column:auto}.difficulty-head{font-size:12px}.exercise{padding:14px}}
</style></head>
<body><div class="shell">
<header><div class="brand">Fitness</div><div class="tiny">Dein Training, Schritt für Schritt</div></header>
<main id="home">
<div class="top-grid"><section class="card hero"><div><div class="eyebrow">DEIN GANZKÖRPER-WORKOUT</div><h2>Bereit für dein<br>nächstes Workout?</h2><p><span id="taskCopy">6 Aufgaben</span> mit Kurzhanteln, Stuhl und Couch.</p><div class="difficulty-box"><div class="difficulty-head"><label for="difficulty">Workout-Schwierigkeit</label><strong id="difficultyLabel">Normal · 6 Aufgaben</strong></div><input id="difficulty" type="range" min="1" max="10" step="1" value="3" aria-label="Workout-Schwierigkeit einstellen"><div class="difficulty-ends"><span>Leichter</span><span>Mehr Wiederholungen & Aufgaben</span></div></div><button class="start" id="startBtn"><span>▶</span> Workout starten</button></div></section>
<section class="card week-card"><h2>Diese Woche</h2><div class="week-count"><span id="weekTotal">0</span> <small>Trainingseinheiten</small></div><div class="week" id="week"></div><div class="week-note">Jeder aktive Tag ist ein Erfolg.</div></section></div>
</main>
<main id="workout" class="workout-view hidden"></main>
</div><script>
const KEY='weiter-fitness-simple-v1',DIFFICULTY_KEY='weiter-fitness-difficulty-v1';const levels=[{name:'Leicht',tasks:4,extra:-2,sets:2},{name:'Locker',tasks:5,extra:-1,sets:2},{name:'Normal',tasks:6,extra:0,sets:2},{name:'Aktiv',tasks:6,extra:1,sets:2},{name:'Kräftig',tasks:7,extra:2,sets:2},{name:'Anspruchsvoll',tasks:7,extra:3,sets:2},{name:'Schwer',tasks:8,extra:4,sets:2},{name:'Sehr schwer',tasks:8,extra:4,sets:3},{name:'Intensiv',tasks:8,extra:5,sets:3},{name:'Maximal',tasks:8,extra:6,sets:3}];const exercises=[
 {id:'squat',name:'Kniebeuge zum Stuhl',sub:'Kurzhantel vor der Brust',muscle:'BEINE',reps:10,art:'squat'},
 {id:'push',name:'Erhöhte Liegestütze',sub:'Hände an der stabilen Couch',muscle:'BRUST',reps:8,art:'push'},
 {id:'row',name:'Einarmiges Rudern',sub:'Mit der freien Hand am Stuhl abstützen',muscle:'RÜCKEN',reps:10,art:'row',sides:true},
 {id:'hinge',name:'Rumänisches Kreuzheben',sub:'Kurzhanteln nah an den Beinen führen',muscle:'BEINE · PO',reps:10,art:'hinge'},
 {id:'bridge',name:'Glute Bridge',sub:'Schultern am Boden, Hüfte anheben',muscle:'PO',reps:12,art:'bridge'},
 {id:'press',name:'Schulterdrücken im Sitzen',sub:'Aufrecht sitzen, Hanteln kontrolliert über Kopf drücken',muscle:'SCHULTERN',reps:8,art:'press'},
 {id:'curl',name:'Bizepscurls im Stand',sub:'Ellbogen nah am Körper halten',muscle:'ARME',reps:10,art:'curl'},
 {id:'calf',name:'Wadenheben am Stuhl',sub:'Am Stuhl festhalten und auf die Zehenspitzen steigen',muscle:'WADEN',reps:12,art:'calf'},
 {id:'plank',name:'Plank',sub:'Unterarme aufstützen und den Körper gerade halten',muscle:'RUMPF',seconds:20,duration:true,art:'plank'},
 {id:'pushClassic',name:'Liegestütze',sub:'Hände etwa schulterbreit, Körper in einer Linie',muscle:'BRUST',reps:8,pushups:true,art:'pushClassic'},
 {id:'situps',name:'Sit-ups',sub:'Kontrolliert aufrichten und langsam absenken',muscle:'RUMPF',reps:10,art:'situps'},
 {id:'sidePlank',name:'Seitliche Planke',sub:'Hüfte anheben und je Seite stabil halten',muscle:'RUMPF',seconds:18,duration:true,sides:true,art:'sidePlank'},
 {id:'deadbug',name:'Dead Bug',sub:'Gegengleichen Arm und Bein langsam strecken',muscle:'RUMPF',reps:8,sides:true,art:'deadbug'},
 {id:'mountainClimber',name:'Mountain Climbers',sub:'Abwechselnd ein Knie kontrolliert nach vorn führen',muscle:'RUMPF · AUSDAUER',reps:16,art:'mountainClimber'},
 {id:'floorPress',name:'Kurzhantel-Bodendrücken',sub:'Auf dem Rücken liegend Hanteln über der Brust drücken',muscle:'BRUST',reps:10,art:'floorPress'},
 {id:'lateralRaise',name:'Seitheben mit Kurzhanteln',sub:'Arme mit leicht gebeugten Ellbogen seitlich anheben',muscle:'SCHULTERN',reps:10,art:'lateralRaise'},
 {id:'hammerCurl',name:'Hammer Curls',sub:'Kurzhanteln mit neutralem Griff nach oben führen',muscle:'ARME',reps:10,art:'hammerCurl'},
 {id:'reverseLunge',name:'Rückwärts-Ausfallschritte',sub:'Mit Kurzhanteln kontrolliert einen Schritt zurück machen',muscle:'BEINE · PO',reps:8,sides:true,art:'reverseLunge'}
];const routines=[['squat','pushClassic','row','plank','hinge','situps','floorPress','calf'],['reverseLunge','sidePlank','press','deadbug','bridge','hammerCurl','mountainClimber','push'],['squat','push','mountainClimber','floorPress','hinge','lateralRaise','situps','calf'],['reverseLunge','pushClassic','sidePlank','curl','deadbug','row','hammerCurl','bridge']];let session=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function getLevel(){return Math.max(1,Math.min(10,Number(localStorage.getItem(DIFFICULTY_KEY))||3))}
function selectedExercises(level=getLevel()){const index=read().length%routines.length;const byId=new Map(exercises.map(ex=>[ex.id,ex]));return routines[index].slice(0,levels[level-1].tasks).map(id=>byId.get(id))}
function targetAmount(ex,level=getLevel()){const extra=levels[level-1].extra;return ex.duration?Math.max(10,Math.min(90,ex.seconds+extra*3)):Math.max(6,Math.min(18,ex.reps+extra))}
function updateDifficulty(){const level=getLevel(),cfg=levels[level-1],count=cfg.tasks;$('difficulty').value=level;$('difficultyLabel').textContent=cfg.name+' · '+count+' Aufgaben · '+cfg.sets+' Sätze';$('taskCopy').textContent=count+' Aufgaben';localStorage.setItem(DIFFICULTY_KEY,String(level))}
function render(){const logs=read(),now=new Date(),start=monday(now),days=['Mo','Di','Mi','Do','Fr','Sa','So'];const active=new Set(logs.filter(x=>new Date(x.date)>=start&&new Date(x.date)<=now).map(x=>dateKey(new Date(x.date))));$('week').replaceChildren();for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const el=document.createElement('div');el.className='day'+(active.has(dateKey(d))?' done':'')+(dateKey(d)===dateKey(now)?' today':'');const b=document.createElement('b');b.textContent=active.has(dateKey(d))?'✓':d.getDate();const s=document.createElement('span');s.textContent=days[i];el.append(b,s);$('week').append(el)}$('weekTotal').textContent=active.size;updateDifficulty()}
function $(id){return document.getElementById(id)}
const artFiles={squat:'squat-chair.webp',push:'incline-pushup.webp',row:'one-arm-row.webp',hinge:'romanian-deadlift.webp',bridge:'glute-bridge.webp',press:'seated-press.webp',curl:'biceps-curl.webp',calf:'calf-raise.webp',plank:'plank.webp',pushClassic:'pushup-floor.webp',situps:'situps.webp',sidePlank:'side-plank.webp',deadbug:'dead-bug.webp',mountainClimber:'mountain-climber.webp',floorPress:'dumbbell-floor-press.webp',lateralRaise:'lateral-raise.webp',hammerCurl:'hammer-curl.webp',reverseLunge:'reverse-lunge.webp'};
function art(type,name){return `<img src="assets/${artFiles[type]}" alt="Ausführung: ${name}" loading="eager">`}
function start(){const level=getLevel();session={started:Date.now(),index:0,entries:[],level,exercises:selectedExercises(level)};$('home').classList.add('hidden');const root=$('workout');root.classList.remove('hidden');renderWorkout()}
function renderWorkout(){const root=$('workout');if(session.finished){root.innerHTML=`<section class="card finish"><div class="check">✓</div><div class="eyebrow">TRAINING ABGESCHLOSSEN</div><h1>Stark gemacht!</h1><p>${session.total} Wiederholungen gesammelt.${session.totalSeconds?`<br>${session.totalSeconds} Sekunden gehalten.`:''}<br>Davon ${session.pushups} Liegestütze.</p><button class="button primary" id="doneBtn">Zur Übersicht</button><button class="button delete-training" id="deleteWorkoutBtn">Training löschen</button><div class="delete-confirmation hidden" id="deleteConfirmation" role="alertdialog" aria-labelledby="deleteTitle" aria-describedby="deleteDescription"><strong id="deleteTitle">Training wirklich löschen?</strong><p id="deleteDescription">Dieser Trainingseintrag wird dauerhaft entfernt.</p><button class="button light" id="keepWorkoutBtn">Behalten</button><button class="button delete-training" id="confirmDeleteWorkoutBtn">Ja, löschen</button></div></section>`;$('doneBtn').onclick=()=>{session=null;root.classList.add('hidden');$('home').classList.remove('hidden');render()};$('deleteWorkoutBtn').onclick=()=>{$('deleteConfirmation').classList.remove('hidden');$('confirmDeleteWorkoutBtn').focus()};$('keepWorkoutBtn').onclick=()=>{$('deleteConfirmation').classList.add('hidden')};$('confirmDeleteWorkoutBtn').onclick=()=>{save(read().filter(item=>item.id!==session.savedWorkoutId));session=null;root.classList.add('hidden');$('home').classList.remove('hidden');render()};return}const i=session.index,e=session.exercises[i],saved=session.entries[i],cfg=levels[session.level-1],target=targetAmount(e,session.level),reps=saved?saved.reps:Array(cfg.sets).fill(target),unit=e.duration?'Sek.':'Wdh.',fields=reps.map((n,j)=>`<div class="field"><label for="rep${j}">Satz ${j+1} · ${unit}</label><input type="number" min="0" max="100" value="${n}" id="rep${j}" inputmode="numeric"></div>`).join('');root.innerHTML=`<div class="workout-head"><button class="back" id="cancel">← Übersicht</button><span class="tiny">Aufgabe ${i+1} von ${session.exercises.length}</span></div><div class="eyebrow">DEIN WORKOUT · ${cfg.name.toUpperCase()}</div><h1>In deinem Tempo.</h1><p class="workout-desc">Eine Aufgabe nach der anderen. Trage Wiederholungen oder Haltezeiten ein und gehe danach weiter.</p><div class="exercise-list"><article class="card exercise"><div class="art">${art(e.art,e.name)}</div><div><div class="ex-title"><div><h2>${e.name}</h2><small>${e.sub}</small></div><span class="muscle">${e.muscle}</span></div><div class="sets" style="grid-template-columns:repeat(${cfg.sets},minmax(60px,1fr))">${fields}<span class="side-note">${e.duration?(e.sides?'Sek. je Seite':'Haltezeit'):(e.sides?'pro Seite':'')}</span></div></div></article></div><div class="actions"><button class="button light" id="prevBtn" ${i===0?'disabled':''}>← Zurück</button><button class="button primary" id="nextBtn">${i===session.exercises.length-1?'Workout abschließen':'Nächste Aufgabe →'}</button></div><p class="footer-note">Nutze nur einen stabilen Stuhl und eine sichere Couch. Wähle ein Gewicht, das du kontrolliert bewegen kannst.</p>`;$('cancel').onclick=()=>{if(confirm('Workout ohne Speichern verlassen?')){session=null;root.classList.add('hidden');$('home').classList.remove('hidden')}};$('prevBtn').onclick=()=>{if(i>0){storeCurrent();session.index--;renderWorkout()}};$('nextBtn').onclick=()=>{storeCurrent();if(i<session.exercises.length-1){session.index++;renderWorkout()}else finish()}}
function storeCurrent(){session.entries[session.index]={reps:Array.from({length:levels[session.level-1].sets},(_,j)=>Math.max(0,Math.min(100,Number($('rep'+j).value)||0)))}}
function finish(){let total=0,totalSeconds=0,pushups=0;session.exercises.forEach((e,i)=>{const item=session.entries[i]||{reps:Array(levels[session.level-1].sets).fill(0)};let n=item.reps.reduce((sum,value)=>sum+value,0);if(e.sides)n*=2;if(e.duration)totalSeconds+=n;else{total+=n;if(e.pushups)pushups=n}});if(total===0&&totalSeconds===0){alert('Trage mindestens eine Wiederholung oder Haltezeit ein, um das Workout zu speichern.');return}const logs=read(),workoutId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();logs.push({id:workoutId,date:new Date().toISOString(),totalReps:total,pushups,totalSeconds});save(logs);session.savedWorkoutId=workoutId;session.total=total;session.pushups=pushups;session.totalSeconds=totalSeconds;session.finished=true;renderWorkout()}
$('difficulty').addEventListener('input',e=>{localStorage.setItem(DIFFICULTY_KEY,e.target.value);updateDifficulty()});$('startBtn').onclick=start;render();
</script></body></html>
