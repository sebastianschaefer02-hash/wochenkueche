<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e9"><title>Wochenküche – Prototyp</title>
<style>
:root{--bg:#f4f3ed;--paper:#fffefa;--ink:#24332d;--muted:#758078;--green:#426b55;--pale:#e3ebdf;--line:#e5e6dd;--orange:#d18a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}header{padding:28px 20px 18px;background:linear-gradient(135deg,#e5ecdf,#f4f3ed)}header .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);font-weight:750}h1{font-size:29px;line-height:1.1;margin:8px 0}header p{margin:0;color:#5e6b62;font-size:14px}.wrap{max-width:760px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;padding:5px;background:#e8e9e0;border-radius:14px;margin:0 0 18px}.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:11px 4px;font-weight:700;color:#657168;font-size:13px}.tab.active{background:var(--paper);color:var(--green);box-shadow:0 1px 4px #0000000d}.section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;gap:12px}.section-head h2{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:0 2px 8px #24332d05}.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.dayhead strong{font-size:16px}.today{font-size:11px;background:var(--pale);color:var(--green);border-radius:20px;padding:5px 8px;font-weight:700}.mealrow{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.mealtype{font-size:12px;color:var(--muted);font-weight:650}.selectmeal,select,input,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid #dfe2d8;background:#fff;border-radius:10px;padding:11px;min-width:0}.selectmeal{padding:10px;font-size:14px}.empty{color:#9aa198;font-size:13px}.btn{border:0;background:var(--green);color:white;font-weight:750;padding:11px 14px;border-radius:11px;font-size:13px}.btn.secondary{background:var(--pale);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);padding:8px}.btn.danger{background:#f8e7e2;color:#8d4235}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:10px}.ingredients{display:flex;flex-direction:column;gap:8px}.ingredient-row{display:grid;grid-template-columns:minmax(0,1fr) 32px 28px 32px 30px;gap:5px;align-items:center}.ingredient-row input{padding:9px;font-size:13px}.ingredient-row button{border:0;background:var(--pale);color:var(--green);font-size:18px;border-radius:9px;min-height:36px}.ingredient-row .remove{background:transparent;color:#9c5b4b;font-size:20px}.recipe-click{border:0;background:transparent;text-align:left;color:var(--ink);font:inherit;width:100%;padding:0;cursor:pointer}.recipe-click .recipe-title{display:block}.recipe-card{cursor:pointer}.recipe-card:active{transform:scale(.995)}.detail-back{margin-bottom:12px}.qty-controls{display:flex;align-items:center;gap:5px}.recipe-note{white-space:pre-wrap;line-height:1.5}.recipe-title{font-size:16px;font-weight:750}.pill{font-size:11px;color:var(--green);background:var(--pale);border-radius:20px;padding:5px 8px;white-space:nowrap}.recipe-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.muted{color:var(--muted);font-size:13px}.listitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listitem input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}.listitem.checked .listtext{text-decoration:line-through;color:#a0a79f}.listtext{flex:1;font-size:14px}.qty{font-size:12px;color:var(--muted);white-space:nowrap}.group-title{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 5px}.notice{background:#f8f0e5;border-radius:12px;padding:12px;color:#785b3c;font-size:12px;line-height:1.45;margin-bottom:14px}.hidden{display:none!important}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffefaee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:11px}.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--orange);color:white;border-radius:50%;font-size:11px;margin-left:4px;padding:0 5px}@media(max-width:420px){.grid{grid-template-columns:1fr}.ingredient-row{grid-template-columns:1fr 58px 65px 24px}.wrap{padding:12px}.card{padding:13px}.mealrow{grid-template-columns:68px 1fr}}

/* Warmes Beige-Design und iPhone-Eingabefelder */
:root{--bg:#f7f1e9;--paper:#fffcf7;--ink:#35251d;--muted:#8b7a6e;--green:#8c5e3e;--pale:#f0e0d2;--line:#e8d9ca;--orange:#b57b4b}
body{background:var(--bg);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.wrap{padding-top:calc(18px + env(safe-area-inset-top));max-width:760px}
.tabs{background:#ece1d5;border-radius:18px;padding:6px;margin-bottom:24px}
.tab{color:#756052;border-radius:14px;font-size:15px;padding:14px 5px}
.tab.active{background:#fffaf5;color:#805336;box-shadow:0 3px 10px #6a483313}
.section-head{margin:12px 0 16px}.section-head h2{font-size:24px}
.card{border-color:#e9dacb;border-radius:22px;box-shadow:0 5px 18px #6a483309;padding:17px;margin-bottom:14px}
.dayhead strong{font-size:19px}.today,.pill{background:#f2e2d4;color:#8b5834}
.btn{background:#956747;border-radius:13px;font-size:15px}.btn.secondary{background:#efdfd0;color:#835537}.btn.ghost{color:#835537}
.selectmeal,select,input,textarea{background:#fffdfa;border-color:#e4d5c7;color:var(--ink);font-size:16px!important}
.ingredient-row input{font-size:16px!important}
.ingredient-row button{background:#efe0d2;color:#805638}
.notice{display:none!important}
.footer{display:none!important}
.count{background:#b78052}
@media(max-width:420px){.wrap{padding-left:12px;padding-right:12px}.card{padding:14px}.tab{font-size:14px}}
/* Schnellwahl für alltägliche Einkäufe */
.quick-panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 18px}
.quick-title{font-weight:800;font-size:17px;margin-bottom:5px}
.quick-help{color:var(--muted);font-size:13px;margin-bottom:13px;line-height:1.45}
.quick-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick-chip{border:1px solid #e1cdbb;border-radius:999px;background:#f8eee4;color:#745037;font-size:14px;font-weight:650;padding:10px 13px;cursor:pointer;min-height:42px}
.quick-chip.added{background:#986c4c;color:white;border-color:#986c4c}
.quick-add-form{display:flex;gap:8px}
.quick-add-form input{flex:1;min-width:0}
.quick-add-form .btn{flex-shrink:0}
.shopping-title{font-size:16px;font-weight:800;margin:18px 0 9px}
.shopping-empty{color:var(--muted);font-size:14px;padding:10px 0}
.quick-manage{border:0;background:transparent;color:var(--green);text-decoration:underline;font-size:13px;padding:7px 0;cursor:pointer}
.quick-manage-panel{margin-top:6px;border-top:1px solid var(--line);padding-top:9px}
.quick-manage-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.quick-manage-row button{border:0;background:#f5e3dd;color:#8b493b;border-radius:8px;padding:7px 10px}
@media(max-width:420px){.quick-add-form .btn{padding:11px 12px}}
</style></head><body>

<main class="wrap"><nav class="tabs"><button class="tab active" data-tab="week">Woche</button><button class="tab" data-tab="recipes">Rezepte</button><button class="tab" data-tab="shopping">Einkauf <span id="shoppingCount" class="count">0</span></button></nav>
<section id="weekView"><div class="section-head"><div><h2>Deine Woche</h2></div><button class="btn secondary" id="clearWeek">Leeren</button></div><div id="weekDays"></div></section>
<section id="recipesView" class="hidden"><div id="recipeBrowse"><div class="section-head"><div><h2>Meine Rezepte</h2></div><button class="btn" id="newRecipe">+ Neues</button></div><div id="recipeList"></div></div><div id="recipeEditor" class="hidden"><button type="button" id="backToRecipes" class="btn secondary detail-back">← Alle Rezepte</button><div class="card"><h2 id="editorHeading" style="margin:0 0 14px;font-size:20px">Neues Rezept</h2><form id="recipeForm"><label class="field">Name des Gerichts<input id="recipeName" required placeholder="z. B. Nudeln mit Tomatensauce"></label><div class="field">Zutaten <span class="muted">Nutze + und − für die Anzahl. Keine Grammangaben nötig.</span></div><div id="ingredientRows" class="ingredients"></div><button type="button" id="addIngredient" class="btn secondary" style="margin-top:9px">+ Zutat hinzufügen</button><label class="field" style="margin-top:16px">Rezept / Notiz<textarea id="recipeInstructions" rows="4" placeholder="Wie bereitest du das Gericht zu? Eigene Notizen …"></textarea></label><button class="btn" type="submit" style="width:100%">Rezept speichern</button><button type="button" id="deleteCurrent" class="btn danger" style="width:100%;margin-top:9px">Rezept löschen</button></form></div></div></section>
<section id="shoppingView" class="hidden"><div class="section-head"><div><h2>Einkaufsliste</h2><div class="sub" id="shoppingSubtitle">Automatisch aus deinem Wochenplan</div></div><button class="btn secondary" id="resetChecks">Haken zurücksetzen</button></div><div class="quick-panel"><div class="quick-title">Häufig gebraucht</div><div class="quick-help">Tippe auf einen Artikel, um ihn zur Einkaufsliste hinzuzufügen. Ein weiterer Tipp entfernt ihn wieder.</div><div id="quickItems" class="quick-grid"></div><form id="quickAddForm" class="quick-add-form"><input id="quickNewName" maxlength="70" placeholder="Eigenen Artikel eingeben" aria-label="Neuer Artikel" required><button class="btn" type="submit">+ Speichern</button></form><button type="button" class="quick-manage" id="toggleQuickManage">Gespeicherte Artikel verwalten</button><div id="quickManage" class="quick-manage-panel hidden"></div></div><div class="shopping-title">Deine Einkaufsliste</div><div id="shoppingList" class="card"></div><button id="copyList" class="btn" style="width:100%;margin-top:5px">Einkaufsliste kopieren</button></section>
</main>
<script>
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const starter=[{id:'r1',name:'Nudeln mit Tomatensauce',ingredients:[{name:'Nudeln',qty:1},{name:'Große Tomatensauce',qty:2},{name:'Mittlere Tomatensauce',qty:1},{name:'Wiener',qty:1}],instructions:'Nudeln kochen. Tomatensauce erwärmen und Wiener klein schneiden und dazugeben.'},{id:'r2',name:'Reis-Gemüse-Pfanne',ingredients:[{name:'Reis',qty:1},{name:'Paprika',qty:2},{name:'Zucchini',qty:1}],instructions:'Reis kochen. Gemüse schneiden, anbraten und zusammen servieren.'},{id:'r3',name:'Ofenkartoffeln mit Quark',ingredients:[{name:'Kartoffeln',qty:1},{name:'Quark',qty:1},{name:'Schnittlauch',qty:1}],instructions:'Kartoffeln im Ofen garen. Quark würzen und Schnittlauch unterrühren.'}];
const blankPlan=()=>Object.fromEntries(DAYS.map(d=>[d,{Mittagessen:'',Abendessen:''}]));
let state;try{state=JSON.parse(localStorage.getItem('wochenkueche-v1'))}catch(e){};if(!state)state={recipes:starter,plan:blankPlan(),checked:[],hidden:[]};
// Migrate older prototype recipes to simple count-based ingredients.
state.plan=state.plan||blankPlan();state.recipes=(state.recipes||starter).map(r=>({...r,ingredients:(r.ingredients||[]).map(i=>({name:i.name,qty:Math.max(1,Math.round(Number(i.qty)||1))})),instructions:r.instructions||''}));state.checked=state.checked||[];state.hidden=state.hidden||[];state.quickItems=Array.isArray(state.quickItems)?state.quickItems:['Waschmittel','Brötchen','Schwämme','Toilettenpapier','Küchenrolle','Spülmittel','Müllbeutel'];state.manualItems=Array.isArray(state.manualItems)?state.manualItems:[];let nextId=Date.now(),editingId=null;
function save(){localStorage.setItem('wochenkueche-v1',JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['week','recipes','shopping'].forEach(t=>document.getElementById(t+'View').classList.toggle('hidden',t!==tab));if(tab==='recipes')showRecipeBrowse();if(tab==='shopping')renderShopping()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function renderWeek(){let html='';DAYS.forEach(day=>{html+=`<div class="card"><div class="dayhead"><strong>${day}</strong><span class="today">${(state.plan[day].Mittagessen||state.plan[day].Abendessen)?'GEPLANT':'OFFEN'}</span></div>`;['Mittagessen','Abendessen'].forEach(meal=>{let val=state.plan[day][meal]||'';html+=`<div class="mealrow"><div class="mealtype">${meal}</div><select class="selectmeal" data-day="${day}" data-meal="${meal}"><option value="">+ Gericht auswählen</option>${state.recipes.map(r=>`<option value="${r.id}" ${val===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`});html+='</div>'});document.getElementById('weekDays').innerHTML=html;document.querySelectorAll('.selectmeal').forEach(s=>s.addEventListener('change',e=>{state.plan[e.target.dataset.day][e.target.dataset.meal]=e.target.value;save()}))}
function showRecipeBrowse(){document.getElementById('recipeBrowse').classList.remove('hidden');document.getElementById('recipeEditor').classList.add('hidden');renderRecipes()}
function openRecipe(id=null){editingId=id;let r=id?state.recipes.find(x=>x.id===id):{name:'',ingredients:[{name:'',qty:1}],instructions:''};document.getElementById('recipeBrowse').classList.add('hidden');document.getElementById('recipeEditor').classList.remove('hidden');document.getElementById('editorHeading').textContent=id?'Rezept bearbeiten':'Neues Rezept';document.getElementById('recipeName').value=r?.name||'';document.getElementById('recipeInstructions').value=r?.instructions||'';document.getElementById('ingredientRows').innerHTML='';(r?.ingredients?.length?r.ingredients:[{name:'',qty:1}]).forEach(i=>addIngredientRow(i.name,i.qty));document.getElementById('deleteCurrent').classList.toggle('hidden',!id);window.scrollTo({top:0,behavior:'smooth'})}
function renderRecipes(){document.getElementById('recipeList').innerHTML=state.recipes.length?state.recipes.map(r=>`<button type="button" class="card recipe-card recipe-click" data-open="${r.id}"><span class="recipe-top"><span><span class="recipe-title">${esc(r.name)}</span><span class="muted" style="display:block;margin-top:5px">${r.ingredients.length} Zutaten</span></span><span class="pill">Bearbeiten ›</span></span></button>`).join(''):'<div class="card muted">Noch keine Rezepte vorhanden. Tippe auf „+ Neues“, um dein erstes Gericht anzulegen.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openRecipe(b.dataset.open)))}
function addIngredientRow(name='',qty=1){let row=document.createElement('div');row.className='ingredient-row';row.innerHTML=`<input aria-label="Zutat" placeholder="z. B. Große Tomatensauce" value="${esc(name)}" required><button type="button" class="minus" aria-label="Anzahl verringern">−</button><span class="qty-number" style="text-align:center;font-weight:750">${Math.max(1,Number(qty)||1)}</span><button type="button" class="plus" aria-label="Anzahl erhöhen">+</button><button type="button" class="remove" aria-label="Zutat entfernen">×</button>`;row.dataset.qty=Math.max(1,Number(qty)||1);row.querySelector('.minus').onclick=()=>{row.dataset.qty=Math.max(1,Number(row.dataset.qty)-1);row.querySelector('.qty-number').textContent=row.dataset.qty};row.querySelector('.plus').onclick=()=>{row.dataset.qty=Number(row.dataset.qty)+1;row.querySelector('.qty-number').textContent=row.dataset.qty};row.querySelector('.remove').onclick=()=>{row.remove();if(!document.querySelector('.ingredient-row'))addIngredientRow()};document.getElementById('ingredientRows').appendChild(row)}
document.getElementById('newRecipe').onclick=()=>openRecipe();document.getElementById('backToRecipes').onclick=showRecipeBrowse;document.getElementById('addIngredient').onclick=()=>addIngredientRow();
document.getElementById('recipeForm').addEventListener('submit',e=>{e.preventDefault();let ingredients=[...document.querySelectorAll('.ingredient-row')].map(row=>({name:row.querySelector('input').value.trim(),qty:Number(row.dataset.qty)||1})).filter(i=>i.name);if(!ingredients.length){alert('Bitte mindestens eine Zutat eintragen.');return}let recipe={id:editingId||'r'+(++nextId),name:document.getElementById('recipeName').value.trim(),ingredients,instructions:document.getElementById('recipeInstructions').value.trim()};if(editingId){state.recipes=state.recipes.map(r=>r.id===editingId?recipe:r)}else state.recipes.push(recipe);save();showRecipeBrowse()});
document.getElementById('deleteCurrent').onclick=()=>{if(editingId&&confirm('Dieses Rezept löschen? Es wird auch aus deinem Wochenplan entfernt.')){state.recipes=state.recipes.filter(r=>r.id!==editingId);DAYS.forEach(d=>Object.keys(state.plan[d]).forEach(m=>{if(state.plan[d][m]===editingId)state.plan[d][m]=''}));editingId=null;save();showRecipeBrowse()}};
function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function getItems(){let items={};DAYS.forEach(day=>Object.entries(state.plan[day]).forEach(([meal,id])=>{let r=state.recipes.find(x=>x.id===id);if(!r)return;r.ingredients.forEach(i=>{let key=i.name.trim().toLocaleLowerCase('de');if(!items[key])items[key]={name:i.name.trim(),qty:0};items[key].qty+=Number(i.qty)||1})}));return Object.entries(items).map(([key,v])=>({key,...v})).sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function getShoppingItems(){
 const items=getItems().filter(i=>!state.hidden.includes(i.key)).map(i=>({...i,source:'recipe'}));
 const byKey=new Map(items.map(i=>[i.key,i]));
 state.manualItems.forEach(name=>{const key=name.trim().toLocaleLowerCase('de');if(!key)return;
   if(byKey.has(key)){byKey.get(key).qty+=1;byKey.get(key).manual=true}
   else{const item={key,name,qty:1,source:'manual',manual:true};items.push(item);byKey.set(key,item)}
 });
 return items.sort((a,b)=>a.name.localeCompare(b.name,'de'));
}
function renderShopping(){
 const all=getShoppingItems(),checked=all.filter(i=>state.checked.includes(i.key)).length;
 document.getElementById('shoppingCount').textContent=all.length-checked;
 document.getElementById('shoppingSubtitle').textContent=`${all.length} Artikel · ${checked} abgehakt`;
 const list=document.getElementById('shoppingList');
 list.innerHTML=all.length?all.map(i=>`<div class="listitem ${state.checked.includes(i.key)?'checked':''}"><input type="checkbox" aria-label="${esc(i.name)} abhaken" data-check="${esc(i.key)}" ${state.checked.includes(i.key)?'checked':''}><span class="listtext">${esc(i.name)}</span><span class="qty">${fmt(i.qty)}×</span><button class="btn ghost" type="button" data-remove-item="${esc(i.key)}" title="Von der Einkaufsliste entfernen" aria-label="${esc(i.name)} entfernen">×</button></div>`).join(''):'<div class="shopping-empty">Deine Liste ist noch leer. Wähle oben einen Artikel oder plane ein Rezept.</div>';
 list.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',()=>{const k=c.dataset.check;state.checked=c.checked?[...new Set([...state.checked,k])]:state.checked.filter(x=>x!==k);save()}));
 list.querySelectorAll('[data-remove-item]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.removeItem;state.manualItems=state.manualItems.filter(x=>x.toLocaleLowerCase('de')!==k);if(getItems().some(i=>i.key===k)&&!state.hidden.includes(k))state.hidden.push(k);state.checked=state.checked.filter(x=>x!==k);save()}));
 const quick=document.getElementById('quickItems');
 quick.innerHTML=state.quickItems.map(name=>{const active=state.manualItems.some(x=>x.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'));return `<button type="button" class="quick-chip ${active?'added':''}" data-quick="${esc(name)}" aria-pressed="${active}">${active?'✓ ':'+ '}${esc(name)}</button>`}).join('');
 quick.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.quick,key=name.toLocaleLowerCase('de');if(state.manualItems.some(x=>x.toLocaleLowerCase('de')===key)){state.manualItems=state.manualItems.filter(x=>x.toLocaleLowerCase('de')!==key)}else{state.manualItems.push(name);state.hidden=state.hidden.filter(x=>x!==key);state.checked=state.checked.filter(x=>x!==key)}save()}));
 const manage=document.getElementById('quickManage');
 manage.innerHTML=state.quickItems.map(name=>`<div class="quick-manage-row"><span>${esc(name)}</span><button type="button" data-delete-quick="${esc(name)}" aria-label="${esc(name)} aus Schnellwahl löschen">Löschen</button></div>`).join('');
 manage.querySelectorAll('[data-delete-quick]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.deleteQuick;state.quickItems=state.quickItems.filter(x=>x!==name);save()}));
}
document.getElementById('quickAddForm').addEventListener('submit',e=>{e.preventDefault();const field=document.getElementById('quickNewName');const name=field.value.trim();if(!name)return;const key=name.toLocaleLowerCase('de');if(!state.quickItems.some(x=>x.toLocaleLowerCase('de')===key))state.quickItems.push(name);if(!state.manualItems.some(x=>x.toLocaleLowerCase('de')===key))state.manualItems.push(name);state.hidden=state.hidden.filter(x=>x!==key);state.checked=state.checked.filter(x=>x!==key);field.value='';save();field.blur()});
document.getElementById('toggleQuickManage').onclick=()=>document.getElementById('quickManage').classList.toggle('hidden');
document.getElementById('clearWeek').onclick=()=>{if(confirm('Den gesamten Wochenplan leeren?')){state.plan=blankPlan();state.checked=[];state.hidden=[];save()}};document.getElementById('resetChecks').onclick=()=>{state.checked=[];save()};document.getElementById('copyList').onclick=async()=>{let text=getShoppingItems().map(i=>`${state.checked.includes(i.key)?'[x]':'[ ]'} ${i.name} — ${fmt(i.qty)}×`).join('\n');try{await navigator.clipboard.writeText(text);alert('Einkaufsliste kopiert!')}catch(e){prompt('Kopiere deine Einkaufsliste:',text)}};
